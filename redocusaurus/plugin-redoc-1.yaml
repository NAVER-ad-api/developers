          description: 캠페인 통계 객체
        budgetExhausted:
          type: boolean
          description: 캠페인 지출 한도 도달 여부
        spentBudgetRatio:
          type: number
        bidTypes:
          type: array
          items:
            type: string
            enum:
              - CPC
              - CPM
              - CPV
          uniqueItems: true
        status:
          type: string
          description: 캠페인 상태
          enum:
            - RUNNABLE
            - RUNNABLE_LEARNING
            - RUNNABLE_LEARNING_LIMIT
            - DELETED
            - BUDGET_EXHAUSTED

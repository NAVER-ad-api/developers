          description: adAccountNo
        - name: adSetNo
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: adSetNo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdSetDeviceAndPlacementGroupParam'
        required: true
        description: editParam
  /{version}/adAccounts/{adAccountNo}/adSets/{adSetNo}/interest:
    put:
      tags:
        - 광고 그룹
      summary: 광고 그룹 관심사/구매의도 변경
      operationId: editInterestUsingPUT
      responses:
        '200':
          description: 변경 완료했습니다.

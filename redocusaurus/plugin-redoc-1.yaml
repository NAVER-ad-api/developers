openapi: 3.0.1
info:
  title: 광고 API
  description: >-
    <b>공통 HEADER PARAMETERS</b><br/> - `AccessManagerAccountNo`: 해당 광고 계정에 대한 접근
    권한이 있는 관리 계정 ID. 관리계정으로만 멤버인 경우, 이 값을 포함해서 호출해야 광고계정에 대한 호출이 가능합니다.
  version: '1.0'
servers:
  - url: https://openapi.naver.com/v1/ad-api
tags:
  - name: 캠페인
  - name: 광고 그룹
  - name: 광고 소재
  - name: 타겟팅 상세
  - name: 타입 정보
  - name: 잠재고객
paths:
  /{version}/adAccounts/{adAccountNo}/adSets:
    get:
      tags:
        - 광고 그룹
      summary: 광고 그룹 목록
      operationId: getListUsingGET
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageOpenAdSetListView'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: activated
          in: query
          description: 광고 그룹 ON/OFF 여부. 미입력 시 모든 광고 그룹을 검색합니다.
          required: false
          schema:
            type: boolean
        - name: adAccountNo
          in: path
          description: adAccountNo
          required: true
          schema:
            type: integer
            format: int64
        - name: budgetTypes
          in: query
          description: 광고 그룹의 예산 타입
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - DAILY
                - TOTAL
            enum:
              - DAILY
              - TOTAL
          style: form
          explode: true
        - name: campaignNo
          in: query
          description: 상위 캠페인 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: deleteOnly
          in: query
          description: >-
            삭제된 광고 그룹만 검색. true 인 경우 삭제된 광고 그룹, false 인 경우 운영가능/광고집행전/광고집행종료 상태의
            광고 그룹을 검색합니다.
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          description: '페이지 번호 (기본값: 0)'
          required: false
          schema:
            type: integer
            format: int32
        - name: placementGroupCodes
          in: query
          description: 광고 그룹의 게재 위치
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: size
          in: query
          description: '페이지 크기 (기본값: 10, 최대: 100)'
          required: false
          schema:
            type: integer
            format: int32
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
    post:
      tags:
        - 광고 그룹
      summary: 광고 그룹 만들기
      operationId: createAdSetUsingPOST
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OpenAdSetCreationParam'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
        - name: adAccountNo
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: adAccountNo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAdSetCreationParam'
        required: true
        description: params
    delete:
      tags:
        - 광고 그룹
      summary: 광고 그룹 다중 삭제
      operationId: deleteAdSetsUsingDELETE
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuccessResponse'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: adAccountNo
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: adAccountNo
        - name: adSetNos
          in: query
          description: 광고 그룹 ID 목록
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
            maxItems: 100
            minItems: 1
            uniqueItems: true
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
  /{version}/adAccounts/{adAccountNo}/adSets/activate:
    post:
      tags:
        - 광고 그룹
      summary: 광고 그룹 ON/OFF 다중 변경
      operationId: activateAdSetsUsingPOST
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuccessResponse'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: adAccountNo
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: adAccountNo
        - name: adSetNos
          in: query
          description: 광고 그룹 ID 목록
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
            maxItems: 100
            minItems: 1
            uniqueItems: true
        - name: activated
          in: query
          description: 'ON/OFF 설정. (예, true : ON)'
          required: true
          schema:
            type: boolean
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
  /{version}/adAccounts/{adAccountNo}/adSets/edit:
    post:
      tags:
        - 광고 그룹
      summary: 광고 그룹 예산/입찰가/비용관리 다중 변경
      operationId: editAdSetBidAndBudgetUsingPOST
      responses:
        '200':
          description: 변경 완료했습니다.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 잘못된 요청입니다.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '422':
          description: 처리할 수 없는 상태입니다.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResult'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
        - name: adAccountNo
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: adAccountNo
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AdSetBidAndBudgetEditParam'
                - $ref: '#/components/schemas/AdSetEditBidPriceParam'
                - $ref: '#/components/schemas/AdSetEditBidStrategyValueParam'
                - $ref: '#/components/schemas/AdSetEditBudgetParam'
        required: true
        description: editParam
  /{version}/adAccounts/{adAccountNo}/adSets/sampleByCampaignNo:
    get:
      tags:
        - 광고 그룹
      summary: 광고 그룹 만들기 - 샘플
      description: 캠페인 하위 광고 그룹 만들기 위한 기본값으로 채워진 샘플
      operationId: sampleByCampaignNoUsingGET
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OpenAdSetCreationParam'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: campaignNo
          in: query
          description: campaignNo
          required: true
          schema:
            type: integer
            format: int64
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
  /{version}/adAccounts/{adAccountNo}/adSets/typeInfoByCampaignNo:
    get:
      tags:
        - 광고 그룹
      summary: 광고 그룹 만들기 - 타입 정보
      description: 캠페인 하위 광고 그룹 만들기 위한, 사용가능한 타입 목록. 단, 다른 조건에 따라 불가능한 케이스가 발생할 수도 있습니다.
      operationId: typeInfoByCampaignNoUsingGET
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AvailableTypesOfAdSet'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: campaignNo
          in: query
          description: campaignNo
          required: true
          schema:
            type: integer
            format: int64
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
  /{version}/adAccounts/{adAccountNo}/adSets/{adSetNo}:
    get:
      tags:
        - 광고 그룹
      summary: 광고 그룹 조회
      operationId: getAdSetUsingGET
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OpenAdSetView'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: adAccountNo
          in: path
          description: adAccountNo
          required: true
          schema:
            type: integer
            format: int64
        - name: adSetNo
          in: path
          description: adSetNo
          required: true
          schema:
            type: integer
            format: int64
        - name: includeCreativeTemplates
          in: query
          description: 생성 가능한 소재 템플릿 목록 포함 여부
          required: false
          allowEmptyValue: false
          example: false
          schema:
            type: boolean
            default: false
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
    delete:
      tags:
        - 광고 그룹
      summary: 광고 그룹 삭제
      operationId: deleteAdSetUsingDELETE
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuccessResponse'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
        - name: adAccountNo
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: adAccountNo
        - name: adSetNo
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: adSetNo
  /{version}/adAccounts/{adAccountNo}/adSets/{adSetNo}/adidLibraries:
    get:
      tags:
        - 광고 그룹
      summary: 고객파일 타겟 조회
      operationId: getCustomizedTargetingAdidLibraryUsingGET
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenCustomTargetView'
        '400':
          description: 잘못된 요청입니다.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '422':
          description: 처리할 수 없는 상태입니다.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResult'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: adAccountNo
          in: path
          description: adAccountNo
          required: true
          schema:
            type: integer
            format: int64
        - name: adSetNo
          in: path
          description: adSetNo
          required: true
          schema:
            type: integer
            format: int64
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
    put:
      tags:
        - 광고 그룹
      summary: 고객파일 타겟 수정
      description: >-
        - 기존의 정의된 고객파일 타겟은 삭제되고, 요청한 타겟 리스트로 재정의 됩니다.

        - 사용 가능 상태의 타겟을 최대 30개까지 선택 할 수 있으며 타겟 모수가 1,000 미만인 경우 포함(타게팅) 설정 할 수
        없습니다.
      operationId: editCustomizedTargetingAdidLibraryUsingPUT
      responses:
        '200':
          description: 변경 완료했습니다.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomTargetParam'
        '400':
          description: 잘못된 요청입니다.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResult'
        '422':
          description: 처리할 수 없는 상태입니다.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResult'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: adAccountNo
          in: path
          description: adAccountNo
          required: true
          schema:
            type: integer
            format: int64
        - name: adSetNo
          in: path
          description: adSetNo
          required: true
          schema:
            type: integer
            format: int64
        - name: version
          in: path
          description: API 버전
          required: true
          schema:
            type: number
            format: float
            default: 1
      requestBody:
        description: params
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/CreateCustomizedTargetingAdidLibrariesRequest

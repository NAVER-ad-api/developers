  /{version}/adAccounts/{adAccountNo}/campaigns:
    get:
      tags:
        - 캠페인
      summary: 캠페인 목록
      operationId: getListOldUsingGET
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageOpenCampaignView'
      deprecated: false
      parameters:
        - name: AccessManagerAccountNo
          in: header
          description: 해당 광고 계정에 대한 접근 권한이 있는 관리 계정 ID
          required: false
          schema:
            type: integer
            format: int64
        - name: activated
          in: query
          description: true/false 인 경우 각각 ON/OFF 인 캠페인만 검색합니다. 값이 없을 시 모든 캠페인을 검색합니다.
          required: false
          schema:
            type: boolean
        - name: adAccountNo
          in: path
          description: adAccountNo
          required: true
          schema:
            type: integer
            format: int64

components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
            - CASE_1
            - CASE_2
            - CASE_3
            - CASE_4
            - CASE_5
            - CONDITION_DOES_NOT_MEET
            - DATA_NOT_EXIST
            - DATA_CONCURRENCY_PROBLEM
            - DUPLICATED_VALUE
            - ALREADY_DONE
            - LIMIT_EXCEEDED
            - NOT_ALLOWED_FILE_TYPE
            - INVALID_PARAMETER
            - INVALID_URL
            - INVALID_SHOPPING
            - INVALID_SURVEY
            - BAD_REQUEST
            - AUTH_ERROR
            - UNDER_CONSTRUCTION
            - MAX_AD_SET_EXCEEDED
            - CBO_INVALID_AD_SETS
            - CBO_INVALID_CREATIVE
            - WEBSITE_TARGET_ALREADY_EXISTS
            - STORE_TARGET_ALREADY_EXISTS
            - AD__SA_INSPECTION_STATUS_FETCH_FAILED
            - AD__SA_BIZ_CHANNEL_NOT_FOUND
            - UNKNOWN_ERROR
        detailCode:
          type: string
        message:
          type: string
        description:
          type: string
        extra: {}
    ErrorResult:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      title: ErrorResult
    OpenCustomTargetAdidUpdateResponse:
      type: object
      properties:
        name:
          type: string
          description: 타겟 name
        'no':
          type: integer
          format: int64
          description: 타겟 no
      title: OpenCustomTargetAdidUpdateResponse
    OpenCampaignOptimizationEditParam:
      type: object
      required:
        - activated
      properties:
        activated:
          type: boolean
          description: 캠페인 예산 최적화 사용 여부
        bidGoal:
          type: string
          description: '예산 최적화 시 적용할 입찰 전략 (클릭수 최대화 : MAX_CLICK, 전환수 최대화 : MAX_CONV)'
          enum:
            - MAX_CLICK
            - MAX_CONV
        bidStrategy:
          type: string
          description: >-
            예산 최적화 시 적용할 비용 관리 (입찰가 한도 : BID_CAP, 비용 한도 : COST_CAP, 한도 없음 :
            NO_CAP) - COST_CAP 은 입찰 전략이 MAX_CLICK 인 경우에만 선택 가능합니다.
          enum:
            - BID_CAP
            - COST_CAP
            - NO_CAP
        bidStrategyValue:
          type: number
          description: 예산 최적화 시 적용할 비용 관리 금액
        budget:
          type: number
          description: 예산 최적화 캠페인의 총 예산
        defaultBudgetAmountForAdSets:
          type: number
          description: '하위 광고그룹에 일괄 적용할 예산값, 기본값: (현재 캠페인 예산) / (현재 광고그룹 갯수)'
        overwriteAllAdSets:
          type: boolean
          description: 하위 광고그룹 일괄 변경 여부
      title: OpenCampaignOptimizationEditParam
    Brand:
      type: object
      properties:
        adAccountNo:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        disabled:
          type: boolean
        explanation:
          type: string
        name:
          type: string
        'no':
